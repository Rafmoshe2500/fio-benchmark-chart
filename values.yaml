---
# Default values for fio-benchmark chart

# Number of FIO benchmark pods to deploy
replicaCount: 3

# FIO container image configuration
image:
  repository: rafmoshe2500/fio
  tag: "3.41"
  pullPolicy: IfNotPresent

# Optional: Image pull secrets for private registries
imagePullSecrets: []
# - name: registry-secret

# Persistent Volume Claim configuration
pvc:
  enabled: true
  size: 10Gi
  storageClassName: ""  # Leave empty for default storage class
  accessMode: ReadWriteOnce

# Mount path for the PVC inside the pod
mountPath: /mnt/fio-data

# FIO job configuration
# You can either provide inline FIO job content or use an external file
fioJob:
  # Inline FIO job configuration (will be overridden by file if provided)
  content: |
    [global]
    ioengine=libaio
    direct=1
    size=1G
    runtime=60
    time_based=1
    group_reporting=1
    
    [random-read]
    rw=randread
    bs=4k
    iodepth=32
    numjobs=4

# Resource limits and requests for FIO pods.
#
# requests == limits on purpose: that is Guaranteed QoS, the only class the
# kubelet will not throttle first under node pressure. A throttled fio client
# reports CFS stalls as storage latency, and nothing downstream can separate
# the two afterwards.
#
# scripts/deploy_test.sh overrides these per test via resource_class_for():
#   light   1 cpu / 1Gi   test_example
#   normal  4 cpu / 4Gi   rate-limited tests
#   heavy   8 cpu / 8Gi   ceiling tests and the burst phases
resources:
  requests:
    memory: "4Gi"
    cpu: "4"
  limits:
    memory: "4Gi"
    cpu: "4"

# Pod restart policy
restartPolicy: Never

# Labels to apply to all resources
labels:
  app: fio-benchmark
  component: storage-test

# Annotations for pods
podAnnotations: {}

# Node selector for pod scheduling
nodeSelector: {}

# Tolerations for pod scheduling
tolerations: []

# Affinity rules for pod scheduling
affinity: {}

# Security context for pods
securityContext: {}
  # runAsUser: 1000
  # runAsGroup: 1000
  # fsGroup: 1000

# Whether to create unique names for each pod and PVC
uniqueNames: true

# Prefix for resource names
namePrefix: "fio-benchmark"

# Unique identifier for this benchmark run. Set by scripts/deploy_test.sh.
# Every Pod, PVC and ConfigMap carries it as a label so collection and
# cleanup can select exactly this run and nothing else.
runId: ""

# Absolute epoch seconds at which every pod should start fio. Lets several
# releases begin at the same instant regardless of when helm returned.
# Empty means "start immediately".
startEpoch: ""

# Lay the dataset out before the measured run starts. Required for read
# tests: without it fio reads sparse or absent files and measures nothing.
prepare:
  enabled: false

# Emit machine-readable results alongside the human-readable output. The
# parser consumes the JSON; the text is for eyeballing a single pod.
fioOutput:
  json: true
  timeSeries: true

# Two benchmark pods on one worker share its NIC and page cache, which shows
# up as array latency that is not array latency. Preferred, not required, so
# a 40-pod test can still schedule on a smaller cluster.
podAntiAffinity:
  enabled: true
